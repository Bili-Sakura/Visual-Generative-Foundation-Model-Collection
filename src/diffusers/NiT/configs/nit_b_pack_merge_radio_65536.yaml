# Example NiT-B training config (paths must be updated for your environment).
# Preprocess ImageNet with https://github.com/WZDTHU/NiT preprocessing scripts first.

model:
  transport:
    path_type: linear
    prediction: v
    weighting: lognormal
  transformer:
    patch_size: 1
    in_channels: 32
    hidden_size: 768
    depth: 12
    num_heads: 12
    qk_norm: true
    class_dropout_prob: 0.1
    num_classes: 1000
    encoder_depth: 4
    z_dim: 1280
    use_checkpoint: false
  enc_type: radio
  enc_dir: checkpoints/radio_v2.5-h.pth.tar
  proj_coeff: 1.0
  use_ema: true
  ema_decay: 0.9999

data:
  data_type: improved_pack
  dataset:
    packed_json: datasets/imagenet1k/sampler_meta/dc-ae-f32c32-sana-1.1-diffusers_merge_LPFHP_65536.json
    jsonl_dir: datasets/imagenet1k/data_meta/dc-ae-f32c32-sana-1.1-diffusers_merge_meta.jsonl
    data_types: ["native-resolution", "fixed-256x256", "fixed-512x512"]
    latent_dirs:
      - datasets/imagenet1k/dc-ae-f32c32-sana-1.1-diffusers-native-resolution
      - datasets/imagenet1k/dc-ae-f32c32-sana-1.1-diffusers-256x256
      - datasets/imagenet1k/dc-ae-f32c32-sana-1.1-diffusers-512x512
    image_dir: /path/to/imagenet/train
  dataloader:
    num_workers: 4
    batch_size: 1

training:
  tracker: tensorboard
  tracker_kwargs: {}
  max_train_steps: 2000000
  checkpointing_steps: 2000
  checkpoints_total_limit: 2
  resume_from_checkpoint: latest
  learning_rate: 5.0e-5
  learning_rate_base_batch_size: 1
  scale_lr: true
  lr_scheduler: constant
  lr_warmup_steps: 0
  gradient_accumulation_steps: 1
  optimizer:
    betas: [0.9, 0.95]
    weight_decay: 1.0e-2
    eps: 1.0e-6
  max_grad_norm: 1.0
  mixed_precision: bf16
  allow_tf32: true
  seed: 0
